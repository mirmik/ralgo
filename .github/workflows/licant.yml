name: Licant

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      PREFIX: ${{ runner.temp }}/mirmik-stack
      CPATH: ${{ runner.temp }}/mirmik-stack/include:${{ github.workspace }}/.ci/RxCpp/Rx/v2/src
      LIBRARY_PATH: ${{ runner.temp }}/mirmik-stack/lib
      LD_LIBRARY_PATH: ${{ runner.temp }}/mirmik-stack/lib

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mirmik/licant
          path: .ci/licant
      - uses: actions/checkout@v4
        with:
          repository: mirmik/igris
          path: .ci/igris
      - uses: actions/checkout@v4
        with:
          repository: mirmik/nos
          path: .ci/nos
      - uses: actions/checkout@v4
        with:
          repository: ReactiveX/RxCpp
          path: .ci/RxCpp

      - name: Patch RxCpp for modern compilers
        working-directory: .ci/RxCpp
        run: git apply ../../.github/patches/rxcpp-modern-compilers.patch

      - name: Install licant
        run: python3 -m pip install ./.ci/licant

      - name: Build and install igris
        working-directory: .ci/igris
        run: timeout 10m python3 ./make.py -j2 install

      - name: Build and install nos
        working-directory: .ci/nos
        run: timeout 10m python3 ./make.py -j2 install

      - name: Build tests
        run: timeout 15m python3 ./make.py -j2 runtests

      - name: Test
        run: timeout 3m ./runtests
