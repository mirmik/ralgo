name: CMake

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      PREFIX: ${{ runner.temp }}/mirmik-stack
      CPATH: ${{ runner.temp }}/mirmik-stack/include:${{ github.workspace }}/.ci/RxCpp/Rx/v2/src
      LIBRARY_PATH: ${{ runner.temp }}/mirmik-stack/lib
      LD_LIBRARY_PATH: ${{ runner.temp }}/mirmik-stack/lib

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mirmik/igris
          path: .ci/igris
      - uses: actions/checkout@v4
        with:
          repository: mirmik/nos
          path: .ci/nos
      - uses: actions/checkout@v4
        with:
          repository: ReactiveX/RxCpp
          path: .ci/RxCpp

      - name: Patch RxCpp for modern compilers
        working-directory: .ci/RxCpp
        run: git apply ../../.github/patches/rxcpp-modern-compilers.patch

      - name: Build and install igris
        run: |
          cmake -S .ci/igris -B .ci/igris/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" -DIGRIS_BUILD_TESTS=OFF
          cmake --build .ci/igris/build --parallel 2
          cmake --install .ci/igris/build

      - name: Build and install nos
        run: |
          cmake -S .ci/nos -B .ci/nos/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" -DNOS_BUILD_TESTS=OFF
          cmake --build .ci/nos/build --parallel 2
          cmake --install .ci/nos/build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRALGO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
